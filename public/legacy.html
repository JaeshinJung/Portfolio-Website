<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="/">
    <title>Redirecting to Home | Jaeshin Jung</title>
    <!-- The DS console that used to live here has been retired. Old links and
         old history entries land on the same screen of the workspace instead:
         #projects, #experience, #skills, #about, #contact and the
         #projects/<id> and #experience/<id> records keep their hash; anything
         else (including the console's hash-less home menu) opens #about.
         replace(), so Back does not return to this page. index.html never
         links or redirects here, so there is no loop. -->
    <script>
        (function () {
            var ROUTES = ['projects', 'experience', 'skills', 'about', 'contact'];
            function target() {
                // Accepts both #skills and #/skills.
                var raw = location.hash.replace(/^#\/?/, '');
                var slash = raw.indexOf('/');
                var kind = slash === -1 ? raw : raw.slice(0, slash);
                if (ROUTES.indexOf(kind) === -1) return '#about';
                if (slash === -1) return '#' + kind;
                // Only the two record collections take an ID.
                if ((kind === 'projects' || kind === 'experience') && raw.length > slash + 1) return '#' + raw;
                return '#' + kind;
            }
            function go() {
                location.replace(new URL('./' + target(), location.href).href);
            }
            go();
            // Should a browser restore this page from the back/forward cache,
            // leave again rather than sit on the redirect notice.
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) go();
            });
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=./#about">
    </noscript>
    <style>
        body {
            background: #0C0A0F;
            color: #E8E4F0;
            font-family: system-ui, sans-serif;
            padding: 48px 24px;
            text-align: center;
        }

        a {
            color: #FFD447;
        }
    </style>
</head>

<body>
    <p>This page has moved to the home page.</p>
    <p><a href="./">Go to home</a></p>
</body>

</html>
