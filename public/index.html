<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Jaeshin Jung — Computer Science @ Texas A&M | Aspiring Game Developer. Portfolio showcasing C++, Unity, and game development projects.">
    <title>Jaeshin Jung | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="skills-awards.html">Skills</a></li>
        </ul>
    </nav>

    <div class="container">

        <!-- HUD — avatar + name + tagline on one compact row -->
        <div class="hud">
            <img src="assets/avatar.png" alt="Jaeshin Jung — pixel avatar" class="hud-avatar" id="home-img">
            <div class="hud-text">
                <h1 id="home-title">Loading...</h1>
                <p class="hud-subtitle" id="home-subtitle">Loading...</p>
            </div>
        </div>

        <h2>Select Stage</h2>
        <div class="project-grid" id="project-list">
            <p class="loading-text" style="grid-column: 1 / -1;">Loading data...</p>
        </div>

        <hr class="section-divider">

        <h2>About</h2>
        <div class="about-text" id="home-about">
            <p>Loading...</p>
        </div>

        <!-- Icons are inline SVG, not an icon font: three glyphs are not worth a
             102 KB third-party stylesheet plus two ~130 KB webfonts. Each one is
             aria-hidden/focusable="false" because the link text beside it
             already names the destination. -->
        <div class="contact-links">
            <a href="https://mail.google.com/mail/?view=cm&to=jjshin2001@gmail.com" target="_blank"><svg
                    viewBox="0 0 512 512" aria-hidden="true" focusable="false">
                    <path
                        d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48L48 64zM0 176L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-208L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z" />
                </svg> Email</a>
            <a href="https://www.linkedin.com/in/jaeshin-jung-21a3a4341/" target="_blank"><svg viewBox="0 0 24 24"
                    aria-hidden="true" focusable="false">
                    <path
                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                </svg> LinkedIn</a>
            <a href="https://github.com/JaeshinJung" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"
                    focusable="false">
                    <path
                        d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                </svg> GitHub</a>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { escapeHtml } from './utils.js';
        import { collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const container = document.getElementById('project-list');

        // Firestore stores every screenshot as an absolute GitHub blob URL even
        // though the identical file already ships in public/assets/. Rewriting to
        // the local path keeps the images on Hosting's CDN, takes a third-party
        // origin off the critical path, and stops all seven breaking the day the
        // repo goes private. Matched on the URL's basename, never on the title:
        // Firestore says 'Horror School' while the file is HorroSchool.png.
        const GITHUB_ASSET_URL = /^https:\/\/github\.com\/[^/]+\/[^/]+\/blob\/[^/]+\/public\/assets\/([^/?#]+)(?:[?#]|$)/;

        // The file's own name, URL-decoded. null for anything that is not the
        // expected blob shape, so an unrecognised URL is left exactly as
        // Firestore holds it.
        function assetBasename(url) {
            const match = GITHUB_ASSET_URL.exec(url);
            if (!match) return null;
            try {
                return decodeURIComponent(match[1]);
            } catch {
                return null; // malformed percent-escape
            }
        }

        // The local path for a GitHub asset URL, or null if it is not one. No
        // width/height hint goes with it: .project-card img already carries
        // aspect-ratio: 16/9, which reserves the box on its own, so measured
        // page height is byte-identical with and without the attributes.
        function localAsset(url) {
            const file = assetBasename(url);
            if (!file) return null;
            return `assets/${encodeURIComponent(file)}`;
        }

        // siteContent/home.profileImageUrl points at the GitHub copy of
        // assets/avatar.png, which is 5.7 MB — more than all seven screenshots
        // put together — to paint a 56x56 HUD box. The static markup already
        // loaded the local copy, so assigning that URL fetched the same picture
        // a second time, remotely, over a three-hop redirect chain. Rewrite to
        // the local path, and when it already matches what the markup shipped,
        // do not touch src at all so there is no second request of any kind.
        function setProfileImage(url) {
            const img = document.getElementById('home-img');
            const file = assetBasename(url);
            if (!file) {
                img.src = url;
                return;
            }
            const src = `assets/${encodeURIComponent(file)}`;
            if (new URL(src, document.baseURI).href === img.src) return;
            // Degrade to the URL Firestore holds if the local file is missing.
            // { once: true }, so a fallback that also fails cannot loop.
            img.addEventListener('error', () => { img.src = url; }, { once: true });
            img.src = src;
        }

        async function loadHome() {
            try {
                const homeDoc = await getDoc(doc(db, 'siteContent', 'home'));
                if (homeDoc.exists()) {
                    const data = homeDoc.data();
                    if (data.profileImageUrl) setProfileImage(data.profileImageUrl);
                    if (data.heroTitle) document.getElementById('home-title').textContent = data.heroTitle;
                    if (data.heroSubtitle) document.getElementById('home-subtitle').textContent = data.heroSubtitle;

                    // Replace newlines with <br> to preserve typical multiline text
                    if (data.aboutMeText) {
                        const formattedText = data.aboutMeText.replace(/\n/g, '<br>');
                        document.getElementById('home-about').innerHTML = `<p>${formattedText}</p>`;
                    }
                } else {
                    document.getElementById('home-title').textContent = 'Jaeshin Jung';
                    document.getElementById('home-subtitle').textContent = 'Computer Science @ Texas A&M University';
                    document.getElementById('home-about').innerHTML = '<p>Computer Science major with a minor...</p>';
                }
            } catch (e) {
                console.error("Error loading home:", e);
                document.getElementById('home-title').textContent = 'Error Loading Data';
            }
        }

        // Excluded by input capability, not by width or user agent: a narrow
        // desktop window must stay playable and a large tablet must not be,
        // and the reason for excluding touch is unreliable input and low-end
        // device performance, not bandwidth.
        const canPlay = !window.matchMedia('(pointer: coarse)').matches;

        // The Repository action, in one place: the card's button and the
        // stage's repo entity are the same offer, so they must not drift —
        // above all not the default message, which used to exist only here.
        function repoAction(isPublic, url, privateMsg) {
            if (isPublic && url) {
                window.open(url, '_blank');
            } else {
                alert(privateMsg || 'Due to security regulations, the code is kept confidential.');
            }
        }

        // The one live embed, if any: { card, embed, btn }.
        let liveGame = null;

        // The one open stage, if any: { card, stage, btn }. A stage and an
        // embed both expand their card to the full row, so two open at once
        // means two cards fighting over the grid. Never more than one of
        // either, site-wide.
        let liveStage = null;

        function closeGame(restoreFocus) {
            if (!liveGame) return;
            const { card, embed, btn } = liveGame;
            liveGame = null;
            // about:blank BEFORE removal: that navigates the frame away and
            // discards the loaded document with its wasm heap while the element
            // is still in the tree. Removing the <iframe> outright leaves that
            // to whenever the GC gets round to it.
            const frame = embed.querySelector('iframe');
            if (frame) frame.src = 'about:blank';
            embed.remove();
            card.classList.remove('is-playing');
            btn.hidden = false;
            if (restoreFocus) btn.focus();
        }

        function closeStage(restoreFocus) {
            if (!liveStage) return;
            const { card, stage, btn } = liveStage;
            liveStage = null;
            stage.remove();
            card.classList.remove('is-stage');
            if (restoreFocus) btn.focus();
        }

        function openGame(card, btn, url, title) {
            closeGame(false); // one at a time
            closeStage(false); // and never beside an open stage

            const embed = document.createElement('div');
            embed.className = 'game-embed';
            embed.tabIndex = -1;
            embed.setAttribute('role', 'group');
            embed.setAttribute('aria-label', `${title} — playable build`);

            const frameBox = document.createElement('div');
            frameBox.className = 'game-frame';

            const placeholder = document.createElement('p');
            placeholder.className = 'loading-text';
            placeholder.textContent = 'Loading game...';

            // Built with DOM APIs, not a template: escapeHtml() does not escape
            // quotes, so a URL and a title must not go near an attribute here.
            const frame = document.createElement('iframe');
            frame.title = `${title} — playable build`;
            frame.allow = 'autoplay; fullscreen; gamepad';
            frame.allowFullscreen = true;
            // No sandbox attribute: it would block the embed host's own scripts.
            // The click is the user gesture, so audio autoplay is already
            // permitted and needs no extra handling.
            frame.src = url;

            frameBox.append(placeholder, frame);

            const close = document.createElement('button');
            close.type = 'button';
            close.className = 'pixel-btn secondary btn-sm game-close';
            close.textContent = 'Close Game';
            close.addEventListener('click', () => closeGame(true));

            embed.append(frameBox, close);
            card.appendChild(embed);
            card.classList.add('is-playing');
            btn.hidden = true;
            liveGame = { card, embed, btn };
            embed.focus();
        }

        // A stage entity: a pixel creature that carries one action. The sprite
        // is decoration for the label beside it, so alt is empty and the label
        // is the accessible name. `tag` is 'a' for anything that navigates —
        // the demo is a link, and a button that calls window.open would cost
        // the middle-click, the context menu and the correct announcement.
        // A null sprite renders the label alone: PLAY has no matching art yet.
        function entity(tag, sprite, label) {
            const el = document.createElement(tag);
            if (tag === 'button') el.type = 'button';
            el.className = 'entity';
            if (sprite) {
                const img = document.createElement('img');
                img.src = `assets/sprites/${sprite}.png`;
                img.alt = '';
                img.width = 68;
                img.height = 68;
                el.appendChild(img);
            }
            const text = document.createElement('span');
            text.textContent = label;
            el.appendChild(text);
            return el;
        }

        // Built with DOM APIs, not a template: escapeHtml() does not escape
        // quotes, and a title, a URL and a description all land on attributes
        // here. `n` is the card's position in the grid, so the heading names
        // the stage the way the grid above it does.
        function openStage(card, btn, d, n) {
            closeGame(false);  // one panel at a time, either kind
            closeStage(false);

            const title = d.title || 'Untitled';

            const stage = document.createElement('div');
            stage.className = 'stage';
            stage.tabIndex = -1;
            stage.setAttribute('role', 'group');
            stage.setAttribute('aria-label', `${title} — stage`);

            const heading = document.createElement('h4');
            heading.className = 'stage-title';
            heading.textContent = `Stage ${n} — ${title}`;

            // The screenshot goes BEHIND the frame's transparent hole, which
            // is off-centre; .boss-hole holds the geometry. It is a second
            // <img> element rather than the card's own moved into place — the
            // card's is display: none while the stage is open, and the browser
            // serves the second one from cache.
            const boss = document.createElement('div');
            boss.className = 'boss';
            if (d.imageUrl) {
                const hole = document.createElement('div');
                hole.className = 'boss-hole';
                const shot = document.createElement('img');
                const local = localAsset(d.imageUrl);
                shot.src = local || d.imageUrl;
                if (local) shot.addEventListener('error', () => { shot.src = d.imageUrl; }, { once: true });
                shot.alt = `${title} — screenshot`;
                hole.appendChild(shot);
                boss.appendChild(hole);
            }
            const art = document.createElement('img');
            art.className = 'boss-art';
            art.src = 'assets/sprites/boss-frame.png';
            art.alt = ''; // ornament around the screenshot, not information
            art.width = 196;
            art.height = 132;
            boss.appendChild(art);

            // Always present and never behind a click: the entity below only
            // moves focus here, it does not reveal anything.
            const desc = document.createElement('div');
            desc.className = 'stage-desc';
            desc.tabIndex = -1;
            desc.setAttribute('role', 'group');
            desc.setAttribute('aria-label', `${title} — description`);
            const body = document.createElement('p');
            body.textContent = d.description || '';
            desc.appendChild(body);

            const entities = document.createElement('div');
            entities.className = 'entities';

            if (d.description) {
                const read = entity('button', 'entity-highlights', 'Description');
                read.addEventListener('click', () => desc.focus());
                entities.appendChild(read);
            }

            // Hands off to the card's own Play button so closeGame() restores
            // focus to a control that still exists: this stage is gone by then.
            const play = card.querySelector('.play-btn');
            if (play) {
                const enter = entity('button', null, 'Play');
                enter.addEventListener('click', () => openGame(card, play, d.playUrl, title));
                entities.appendChild(enter);
            }

            // Always offered, exactly like the card's button: a repository that
            // is not public is not missing data, it is the confidentiality note.
            const repo = entity('button', 'entity-repo', 'Repository');
            repo.addEventListener('click', () => repoAction(d.isRepoPublic !== false, d.repoUrl, d.privateMessage));
            entities.appendChild(repo);

            if (d.demoUrl) {
                const demo = entity('a', 'entity-demo', 'Demo Video');
                demo.href = d.demoUrl;
                demo.target = '_blank';
                entities.appendChild(demo);
            }

            const close = document.createElement('button');
            close.type = 'button';
            close.className = 'pixel-btn secondary btn-sm stage-close';
            close.textContent = 'Close Stage';
            close.addEventListener('click', () => closeStage(true));

            stage.append(heading, boss, entities);
            if (d.description) stage.appendChild(desc);
            stage.appendChild(close);

            card.appendChild(stage);
            card.classList.add('is-stage');
            liveStage = { card, stage, btn };
            stage.focus();
        }

        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            // At most one of the two is open, so this closes exactly one panel
            // and hands focus back to whatever opened it.
            closeGame(true);
            closeStage(true);
        });

        async function loadProjects() {
            try {
                const snapshot = await getDocs(collection(db, 'projects'));

                if (snapshot.empty) {
                    container.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">No projects yet. Add entries from the admin panel.</p>';
                    return;
                }

                // Sort client-side, not with orderBy(): the 'order' field has
                // duplicate values, so ordering on it alone is nondeterministic,
                // and a second orderBy would need a Firestore composite index.
                const projects = snapshot.docs.map(d => d.data());
                projects.sort((a, b) => {
                    const orderA = Number(a.order) || 0;
                    const orderB = Number(b.order) || 0;
                    if (orderA !== orderB) return orderA - orderB;
                    const titleA = a.title || '';
                    const titleB = b.title || '';
                    if (titleA < titleB) return -1;
                    if (titleA > titleB) return 1;
                    return 0;
                });

                container.innerHTML = '';
                projects.forEach((d, i) => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    const isPublic = d.isRepoPublic !== false; // backward compat
                    const title = escapeHtml(d.title || 'Untitled');

                    // The first row is above the fold: lazy-loading it would only
                    // delay it. Everything after row 1 loads lazily.
                    const loadAttrs = i < 3
                        ? 'loading="eager" fetchpriority="high"'
                        : 'loading="lazy" decoding="async"';

                    const local = d.imageUrl ? localAsset(d.imageUrl) : null;
                    let imgTag = '';
                    if (d.imageUrl) {
                        const src = local || d.imageUrl;
                        imgTag = `<img src="${escapeHtml(src)}" alt="${title}" ${loadAttrs}>`;
                    }

                    const demoBtn = d.demoUrl
                        ? `<a href="${escapeHtml(d.demoUrl)}" class="video-btn" target="_blank">&#9654; View Demo</a>`
                        : '';

                    // playUrl comes off the document, never a hardcoded map. No
                    // playUrl means no control at all: no disabled button, no
                    // placeholder. Where the pointer is coarse the demo video
                    // stays the path, so only a note goes here.
                    let playBtn = '';
                    if (d.playUrl) {
                        playBtn = canPlay
                            ? '<button type="button" class="pixel-btn play-btn">Play</button>'
                            : '<p class="play-note">Play on desktop</p>';
                    }

                    // Playing is the primary action, so Repository steps down to
                    // .secondary — but only on a card that actually offers it, so
                    // a card without playUrl looks exactly as it did before.
                    const repoClass = d.playUrl && canPlay
                        ? 'pixel-btn secondary repo-btn'
                        : 'pixel-btn repo-btn';

                    card.innerHTML = `
                        ${imgTag}
                        <h3><button type="button" class="stage-btn">${title}</button></h3>
                        <p>${escapeHtml(d.description || '')}</p>
                        <div class="project-card-actions">
                            ${playBtn}
                            <button class="${repoClass}" data-repo-public="${isPublic}" data-repo-url="${escapeHtml(d.repoUrl || '')}" data-private-msg="${escapeHtml(d.privateMessage || '')}">Repository</button>
                            ${demoBtn}
                        </div>
                    `;

                    // If the local file is ever renamed or missing, degrade to the
                    // URL Firestore holds. { once: true }, so a fallback that
                    // also fails cannot loop.
                    if (local) {
                        const img = card.querySelector('img');
                        img.addEventListener('error', () => { img.src = d.imageUrl; }, { once: true });
                    }

                    // The description is clamped to 3 lines in CSS, so keep the
                    // full text reachable on hover. Set as a property, not in the
                    // template: escapeHtml() does not escape quotes.
                    card.querySelector('p').title = d.description || '';

                    // Attach click handler to the Repository button
                    const repoBtn = card.querySelector('.repo-btn');
                    repoBtn.addEventListener('click', () => {
                        repoAction(repoBtn.dataset.repoPublic === 'true', repoBtn.dataset.repoUrl, repoBtn.dataset.privateMsg);
                    });

                    // The heading is the way in. Its visible text is the whole
                    // accessible name — no aria-label, which would only repeat
                    // it — and 'Enter stage' is what the region it opens is
                    // called, announced on arrival.
                    const stageBtn = card.querySelector('.stage-btn');
                    stageBtn.addEventListener('click', () => openStage(card, stageBtn, d, i + 1));

                    const play = card.querySelector('.play-btn');
                    if (play) {
                        play.addEventListener('click', () => {
                            openGame(card, play, d.playUrl, d.title || 'Untitled');
                        });
                    }

                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Firestore error:', err);
                container.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">Failed to load projects.</p>';
            }
        }

        loadHome();
        loadProjects();
    </script>
</body>

</html>
