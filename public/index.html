    <script type="module">
        import { db } from './firebase-config.js';
        import { escapeHtml } from './utils.js';
        import { collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const container = document.getElementById('project-list');

        // Firestore stores every screenshot as an absolute GitHub blob URL even
        // though the identical file already ships in public/assets/. Rewriting to
        // the local path keeps the images on Hosting's CDN, takes a third-party
        // origin off the critical path, and stops all seven breaking the day the
        // repo goes private. Matched on the URL's basename, never on the title:
        // Firestore says 'Horror School' while the file is HorroSchool.png.
        const GITHUB_ASSET_URL = /^https:\/\/github\.com\/[^/]+\/[^/]+\/blob\/[^/]+\/public\/assets\/([^/?#]+)(?:[?#]|$)/;

        // The file's own name, URL-decoded. null for anything that is not the
        // expected blob shape, so an unrecognised URL is left exactly as
        // Firestore holds it.
        function assetBasename(url) {
            const match = GITHUB_ASSET_URL.exec(url);
            if (!match) return null;
            try {
                return decodeURIComponent(match[1]);
            } catch {
                return null; // malformed percent-escape
            }
        }

        // The local path for a GitHub asset URL, or null if it is not one. No
        // width/height hint goes with it: .project-card img already carries
        // aspect-ratio: 16/9, which reserves the box on its own, so measured
        // page height is byte-identical with and without the attributes.
        function localAsset(url) {
            const file = assetBasename(url);
            if (!file) return null;
            return `assets/${encodeURIComponent(file)}`;
        }

        // siteContent/home.profileImageUrl points at the GitHub copy of
        // assets/avatar.png, which is 5.7 MB — more than all seven screenshots
        // put together — to paint a 56x56 HUD box. The static markup already
        // loaded the local copy, so assigning that URL fetched the same picture
        // a second time, remotely, over a three-hop redirect chain. Rewrite to
        // the local path, and when it already matches what the markup shipped,
        // do not touch src at all so there is no second request of any kind.
        function setProfileImage(url) {
            const img = document.getElementById('home-img');
            const file = assetBasename(url);
            if (!file) {
                img.src = url;
                return;
            }
            const src = `assets/${encodeURIComponent(file)}`;
            if (new URL(src, document.baseURI).href === img.src) return;
            // Degrade to the URL Firestore holds if the local file is missing.
            // { once: true }, so a fallback that also fails cannot loop.
            img.addEventListener('error', () => { img.src = url; }, { once: true });
            img.src = src;
        }

        async function loadHome() {
            try {
                const homeDoc = await getDoc(doc(db, 'siteContent', 'home'));
                if (homeDoc.exists()) {
                    const data = homeDoc.data();
                    if (data.profileImageUrl) setProfileImage(data.profileImageUrl);
                    if (data.heroTitle) document.getElementById('home-title').textContent = data.heroTitle;
                    if (data.heroSubtitle) document.getElementById('home-subtitle').textContent = data.heroSubtitle;

                    // Replace newlines with <br> to preserve typical multiline text
                    if (data.aboutMeText) {
                        const formattedText = data.aboutMeText.replace(/\n/g, '<br>');
                        document.getElementById('home-about').innerHTML = `<p>${formattedText}</p>`;
                    }
                } else {
                    document.getElementById('home-title').textContent = 'Jaeshin Jung';
                    document.getElementById('home-subtitle').textContent = 'Computer Science @ Texas A&M University';
                    document.getElementById('home-about').innerHTML = '<p>Computer Science major with a minor...</p>';
                }
            } catch (e) {
                console.error("Error loading home:", e);
                document.getElementById('home-title').textContent = 'Error Loading Data';
            }
        }

        async function loadProjects() {
            try {
                const snapshot = await getDocs(collection(db, 'projects'));

                if (snapshot.empty) {
                    container.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">No projects yet. Add entries from the admin panel.</p>';
                    return;
                }

                // Sort client-side, not with orderBy(): the 'order' field has
                // duplicate values, so ordering on it alone is nondeterministic,
                // and a second orderBy would need a Firestore composite index.
                const projects = snapshot.docs.map(d => d.data());
                projects.sort((a, b) => {
                    const orderA = Number(a.order) || 0;
                    const orderB = Number(b.order) || 0;
                    if (orderA !== orderB) return orderA - orderB;
                    const titleA = a.title || '';
                    const titleB = b.title || '';
                    if (titleA < titleB) return -1;
                    if (titleA > titleB) return 1;
                    return 0;
                });

                container.innerHTML = '';
                projects.forEach((d, i) => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    const isPublic = d.isRepoPublic !== false; // backward compat
                    const title = escapeHtml(d.title || 'Untitled');

                    // The first row is above the fold: lazy-loading it would only
                    // delay it. Everything after row 1 loads lazily.
                    const loadAttrs = i < 3
                        ? 'loading="eager" fetchpriority="high"'
                        : 'loading="lazy" decoding="async"';

                    const local = d.imageUrl ? localAsset(d.imageUrl) : null;
                    let imgTag = '';
                    if (d.imageUrl) {
                        const src = local || d.imageUrl;
                        imgTag = `<img src="${escapeHtml(src)}" alt="${title}" ${loadAttrs}>`;
                    }

                    const demoBtn = d.demoUrl
                        ? `<a href="${escapeHtml(d.demoUrl)}" class="video-btn" target="_blank">&#9654; View Demo</a>`
                        : '';

                    card.innerHTML = `
                        ${imgTag}
                        <h3>${title}</h3>
                        <p>${escapeHtml(d.description || '')}</p>
                        <div class="project-card-actions">
                            <button class="pixel-btn repo-btn" data-repo-public="${isPublic}" data-repo-url="${escapeHtml(d.repoUrl || '')}" data-private-msg="${escapeHtml(d.privateMessage || '')}">Repository</button>
                            ${demoBtn}
                        </div>
                    `;

                    // If the local file is ever renamed or missing, degrade to the
                    // URL Firestore holds. { once: true }, so a fallback that
                    // also fails cannot loop.
                    if (local) {
                        const img = card.querySelector('img');
                        img.addEventListener('error', () => { img.src = d.imageUrl; }, { once: true });
                    }

                    // The description is clamped to 3 lines in CSS, so keep the
                    // full text reachable on hover. Set as a property, not in the
                    // template: escapeHtml() does not escape quotes.
                    card.querySelector('p').title = d.description || '';

                    // Attach click handler to the Repository button
                    const repoBtn = card.querySelector('.repo-btn');
                    repoBtn.addEventListener('click', () => {
                        if (repoBtn.dataset.repoPublic === 'true' && repoBtn.dataset.repoUrl) {
                            window.open(repoBtn.dataset.repoUrl, '_blank');
                        } else {
                            alert(repoBtn.dataset.privateMsg || 'Due to security regulations, the code is kept confidential.');
                        }
                    });

                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Firestore error:', err);
                container.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">Failed to load projects.</p>';
            }
        }

        loadHome();
        loadProjects();
    </script>
